<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Paridera — Control de chanchas</title>
<link rel="manifest" href="manifest.json">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paridera">
<meta name="theme-color" content="#1E1B17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEE6D3;
    --surface:#FAF6E9;
    --surface-2:#F1E8CF;
    --line:#D8C9A3;
    --text:#241B14;
    --text-dim:#8B7A61;
    --accent:#7A2E22;
    --accent-ink:#F6EFDF;
    --sage:#5C7048;
    --ok:#4F6B42;
    --warn:#B9822E;
    --danger:#A23B2B;
    --empty:#A79A82;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#EEE6D3;
    background:var(--bg);
    color:#241B14;
    color:var(--text);
    font-family:'Public Sans',system-ui,sans-serif;
    font-size:18px;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Zilla Slab',serif;margin:0;}
  input,textarea,select,button{font-family:inherit;font-size:18px;color:var(--text);}
  input,textarea,select{
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 11px;
    width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;}
  label{display:block;font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  button{cursor:pointer;border:none;font-weight:600;}
  .field{margin-bottom:14px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:#FAF6E9;
    background:var(--surface);
    border-bottom:1px solid #D8C9A3;
    border-bottom:1px solid var(--line);
    padding:14px 16px;
    display:flex;align-items:center;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .brand svg{flex-shrink:0;}
  .brand h1{font-size:24px;font-weight:700;color:var(--text);letter-spacing:.01em;}
  .brand .sub{font-size:13.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;}
  .iconbtn{
    background:#F1E8CF;
    background:var(--surface-2);
    border:1px solid #D8C9A3;
    border:1px solid var(--line);
    border-radius:8px;
    width:42px;height:42px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);
    flex-shrink:0;
  }
  .btn{
    background:var(--accent);
    color:var(--accent-ink);
    border-radius:8px;
    padding:11px 16px;
    display:flex;align-items:center;gap:7px;
    font-size:16.5px;
    white-space:nowrap;
  }
  .btn.secondary{background:#F1E8CF;background:var(--surface-2);color:#241B14;color:var(--text);border:1px solid #D8C9A3;border:1px solid var(--line);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn:active{transform:translateY(1px);}

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap;
    border-bottom:1px solid #D8C9A3;border-bottom:1px solid var(--line);background:#EEE6D3;background:var(--bg);
    position:sticky;top:73px;z-index:19;
  }
  .toolbar input[type=search]{flex:1;min-width:150px;}
  .toolbar select{width:auto;flex-shrink:0;}

  /* ---------- grid ---------- */
  main{padding:16px;max-width:1100px;margin:0 auto;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;
  }
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-dim);
  }
  .empty-state svg{opacity:.5;margin-bottom:14px;}
  .empty-state p{font-size:17px;max-width:340px;margin:0 auto;}

  .card{
    background:#FAF6E9;
    background:var(--surface);
    border:1px solid #D8C9A3;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 14px 14px;
    position:relative;
    overflow:hidden;
    text-align:left;
  }
  .card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
    background:var(--tab-color,var(--empty));
  }
  .card .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:27px;font-weight:600;color:var(--text);
    display:flex;align-items:baseline;gap:6px;
  }
  .card .num small{font-size:14px;color:var(--text-dim);font-weight:400;}
  .stamp{
    position:absolute;top:12px;right:-6px;
    border:2px solid var(--stamp-color,var(--empty));
    color:var(--stamp-color,var(--empty));
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 9px 2px;
    border-radius:3px;
    transform:rotate(4deg);
    background:rgba(122,46,34,.07);
  }
  .card .dateline{
    margin-top:14px;font-size:14.5px;color:var(--text-dim);
    border-top:1px dashed var(--line);padding-top:10px;
  }
  .card .dateline b{color:var(--text);font-weight:600;}
  .card .litter{font-family:'IBM Plex Mono',monospace;font-size:14px;margin-top:6px;color:var(--text-dim);}
  .card .litter b{color:var(--accent);}

  /* ---------- overlay / modal ---------- */
  .overlay{
    position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);
    z-index:50;display:flex;justify-content:flex-end;
  }
  .overlay.center{justify-content:center;align-items:center;padding:16px;}
  .panel{
    background:#EEE6D3;
    background:var(--bg);
    width:100%;max-width:560px;height:100%;
    overflow-y:auto;
    border-left:1px solid #D8C9A3;
    border-left:1px solid var(--line);
  }
  .overlay.center .panel{
    height:auto;max-height:90vh;border-left:none;border-radius:12px;border:1px solid var(--line);
  }
  .panel-header{
    position:sticky;top:0;background:#FAF6E9;background:var(--surface);
    border-bottom:1px solid #D8C9A3;
    border-bottom:1px solid var(--line);
    padding:16px;display:flex;align-items:center;gap:12px;z-index:2;
  }
  .panel-header h2{font-size:22px;flex:1;}
  .panel-body{padding:16px;background:#EEE6D3;background:var(--bg);}

  details{
    background:#FAF6E9;background:var(--surface);border:1px solid #D8C9A3;border:1px solid var(--line);
    border-radius:8px;margin-bottom:10px;overflow:hidden;
  }
  details[open]{padding-bottom:14px;}
  summary{
    padding:14px 14px;font-family:'Zilla Slab',serif;font-weight:600;font-size:17.5px;
    cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;
    color:var(--text);
  }
  summary::-webkit-details-marker{display:none;}
  summary .chev{transition:transform .15s;color:var(--text-dim);}
  details[open] summary .chev{transform:rotate(90deg);}
  .details-inner{padding:2px 14px 4px;}
  .hint{font-size:13.5px;color:var(--text-dim);margin-top:-8px;margin-bottom:12px;}

  .sanidad-item{
    display:flex;gap:10px;align-items:center;
    background:#EEE6D3;background:var(--bg);border:1px solid #D8C9A3;border:1px solid var(--line);border-radius:6px;
    padding:9px 10px;margin-bottom:8px;font-size:15.5px;
  }
  .sanidad-item .d{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:13.5px;white-space:nowrap;}
  .sanidad-item .desc{flex:1;}
  .sanidad-item button{background:none;color:var(--text-dim);padding:4px;}
  .add-sanidad{display:flex;gap:8px;margin-top:8px;}
  .add-sanidad input:first-child{flex:0 0 130px;}

  .hist-item{
    border-left:3px solid var(--line);padding:8px 0 8px 12px;margin-bottom:8px;font-size:15px;color:var(--text-dim);
  }
  .hist-item b{color:var(--text);}

  .panel-footer{
    position:sticky;bottom:0;background:#FAF6E9;background:var(--surface);
    border-top:1px solid #D8C9A3;
    border-top:1px solid var(--line);padding:14px 16px;
    display:flex;gap:10px;
  }

  .badge-row{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 18px;}
  .pill{
    font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:5px 10px;border-radius:20px;border:1.5px solid var(--pill-color,var(--empty));
    color:var(--pill-color,var(--empty));
  }

  textarea{min-height:80px;resize:vertical;}

  .settings-panel textarea{min-height:160px;font-family:'IBM Plex Mono',monospace;font-size:13.5px;}
  .warn-banner{
    background:var(--warn);color:#2A1E0B;font-size:14.5px;font-weight:600;
    padding:10px 16px;text-align:center;
  }

  @media (max-width:480px){
    .row2,.row3{grid-template-columns:1fr;}
    header{padding:12px;}
    .brand h1{font-size:20px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="96" fill="#F3EEE1"/>
      <circle cx="100" cy="100" r="89" fill="none" stroke="#7A2E22" stroke-width="7"/>
      <text x="100" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="92" fill="#241C15">FD</text>
    </svg>
    <div>
      <h1>Paridera</h1>
      <div class="sub" id="countSub">0 chanchas</div>
    </div>
  </div>
  <button class="iconbtn" id="btnNotif" title="Notificaciones">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
  </button>
  <button class="iconbtn" id="btnSettings" title="Copia de seguridad">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
  </button>
  <button class="btn" id="btnNueva">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
    Nueva
  </button>
</header>

<div class="warn-banner" id="storageBanner" style="display:none;">
  Este navegador no permite guardar datos automáticamente (memoria bloqueada o modo privado). Usá "Exportar" seguido para no perder datos.
</div>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="Buscar por número...">
  <select id="filterSelect">
    <option value="todas">Todos los estados</option>
    <option value="vacia">Vacía</option>
    <option value="gestando">Gestando</option>
    <option value="porparir">Próxima a parir</option>
    <option value="atrasada">Parto atrasado</option>
    <option value="lactancia">Lactancia</option>
    <option value="destetada">Lista p/ servicio</option>
  </select>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<div id="modalRoot"></div>

<script>
(function(){
  'use strict';

  var STORAGE_KEY = 'chanchas_v1';
  var SYNC_KEY = 'chanchas_sync_v1';
  var GESTACION_DIAS = 114;
  var REPETICION_DIAS = 21;
  var hasStorage = (function(){
    try{
      var t = '__test__';
      localStorage.setItem(t, '1');
      localStorage.removeItem(t);
      return true;
    }catch(e){ return false; }
  })();

  var state = {
    chanchas: [],
    search: '',
    filter: 'todas',
    activeId: null,
    settingsOpen: false,
    loaded: false,
    repeticionQueue: [],
    notifiedIds: {},
    repeticionSnoozedUntil: 0
  };

  // ---------- notificaciones del sistema (con degradación en tablets viejas) ----------
  var notifSupported = ('Notification' in window) && ('serviceWorker' in navigator);
  var swRegistration = null;

  function setupNotifications(){
    if(!notifSupported) return;
    try{
      var swCode =
        "self.addEventListener('install',function(e){self.skipWaiting();});" +
        "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});" +
        "self.addEventListener('notificationclick',function(e){" +
          "e.notification.close();" +
          "e.waitUntil(self.clients.matchAll({type:'window'}).then(function(list){" +
            "for(var i=0;i<list.length;i++){ if('focus' in list[i]) return list[i].focus(); }" +
            "if(self.clients.openWindow) return self.clients.openWindow('./');" +
          "}));" +
        "});";
      var blob = new Blob([swCode], {type:'application/javascript'});
      var swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).then(function(reg){
        swRegistration = reg;
      }).catch(function(){ swRegistration = null; });
    }catch(e){ /* tablet vieja: seguimos solo con el aviso dentro de la app */ }
  }

  function notifyRepeticion(cantidad){
    if(!notifSupported || Notification.permission !== 'granted') return;
    var titulo = 'Paridera — Revisar repetición';
    var cuerpo = cantidad === 1 ?
      'Hay 1 chancha para revisar posible repetición.' :
      'Hay ' + cantidad + ' chanchas para revisar posible repetición.';
    try{
      if(swRegistration && swRegistration.showNotification){
        swRegistration.showNotification(titulo, {body: cuerpo, tag:'repeticion', renotify:true});
      } else if(window.Notification){
        new Notification(titulo, {body: cuerpo});
      }
    }catch(e){ /* si falla, el aviso dentro de la app sigue funcionando igual */ }
  }

  function pedirPermisoNotificaciones(){
    if(!notifSupported){
      alert('Este navegador/tablet no soporta notificaciones del sistema. Los avisos van a seguir apareciendo dentro de la app cada vez que la abras.');
      return;
    }
    if(Notification.permission === 'granted'){
      alert('Las notificaciones ya están activadas.');
      return;
    }
    if(Notification.permission === 'denied'){
      alert('Las notificaciones están bloqueadas para esta app. Para activarlas hay que habilitarlas desde los ajustes del navegador (ícono del candado o menú > Configuración del sitio > Notificaciones).');
      return;
    }
    Notification.requestPermission().then(function(perm){
      if(perm === 'granted'){
        alert('Listo, notificaciones activadas.');
      } else {
        alert('No se activaron las notificaciones. Los avisos van a seguir apareciendo dentro de la app cuando la abras.');
      }
    });
  }

  function periodicCheck(){
    checkRepeticiones();
    var nuevos = state.repeticionQueue.filter(function(id){ return !state.notifiedIds[id]; });
    if(nuevos.length){
      nuevos.forEach(function(id){ state.notifiedIds[id] = true; });
      notifyRepeticion(nuevos.length);
    }
    var puedeMostrarModal = state.repeticionQueue.length && !state.activeId && !state.settingsOpen &&
      Date.now() > state.repeticionSnoozedUntil;
    if(puedeMostrarModal){ renderModal(); }
    else { renderGrid(); }
  }

  // ---------- utils ----------
  function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function todayISO(){ var d = new Date(); return d.toISOString().slice(0,10); }
  function addDaysISO(iso, days){
    var d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,10);
  }
  function daysDiff(isoA, isoB){
    var a = new Date(isoA + 'T00:00:00');
    var b = new Date(isoB + 'T00:00:00');
    return Math.round((a - b) / 86400000);
  }
  function fmt(iso){
    if(!iso) return '—';
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function nuevoCiclo(){
    return {
      fechaServicio:'', fechaProbableParto:'', fechaRealParto:'',
      nacidosVivos:'', nacidosMuertos:'', nacidosMomificados:'',
      pesoNacimiento:'', fechaDestete:'', lechonesDestetados:'', pesoDestete:'',
      sanidad: [], observaciones:'',
      repeticionProximaFecha:'', repeticionConfirmada:false
    };
  }
  function nuevaChancha(numero){
    return { id: uid(), numero: numero || '', creada: todayISO(), ciclo: nuevoCiclo(), historial: [] };
  }

  function computeEstado(ciclo){
    var today = todayISO();
    if(!ciclo.fechaServicio) return {key:'vacia', label:'Vacía', color:'var(--empty)'};
    if(ciclo.fechaServicio && !ciclo.fechaRealParto){
      if(ciclo.fechaProbableParto){
        var diff = daysDiff(today, ciclo.fechaProbableParto); // positive = ya pasó la fecha
        if(diff > 3) return {key:'atrasada', label:'Parto atrasado', color:'var(--danger)'};
        if(diff > -6) return {key:'porparir', label:'Próxima a parir', color:'var(--warn)'};
      }
      return {key:'gestando', label:'Gestando', color:'var(--sage)'};
    }
    if(ciclo.fechaRealParto && !ciclo.fechaDestete) return {key:'lactancia', label:'Lactancia', color:'var(--accent)'};
    if(ciclo.fechaDestete) return {key:'destetada', label:'Lista p/ servicio', color:'var(--ok)'};
    return {key:'vacia', label:'Vacía', color:'var(--empty)'};
  }

  function dateline(ciclo, estadoKey){
    if(estadoKey === 'vacia') return 'Sin datos de servicio';
    if(estadoKey === 'gestando' || estadoKey === 'porparir' || estadoKey === 'atrasada'){
      return 'Parto probable: <b>' + fmt(ciclo.fechaProbableParto) + '</b>';
    }
    if(estadoKey === 'lactancia'){
      return 'Parió: <b>' + fmt(ciclo.fechaRealParto) + '</b>';
    }
    if(estadoKey === 'destetada'){
      return 'Destete: <b>' + fmt(ciclo.fechaDestete) + '</b>';
    }
    return '';
  }

  // ---------- persistence (localStorage: queda guardado en este navegador/tablet) ----------
  function checkRepeticiones(){
    var today = todayISO();
    var queue = [];
    state.chanchas.forEach(function(c){
      var ciclo = c.ciclo;
      if(ciclo.fechaServicio && !ciclo.fechaRealParto && !ciclo.repeticionConfirmada && ciclo.repeticionProximaFecha){
        if(daysDiff(today, ciclo.repeticionProximaFecha) >= 0){
          queue.push(c.id);
        }
      }
    });
    state.repeticionQueue = queue;
  }

  // ---------- sincronización entre dispositivos (Firebase Firestore, opcional) ----------
  var syncState = { enabled:false, config:null, code:'', db:null, docRef:null, unsubscribe:null, lastJSON:null, pushTimer:null };

  function firebaseDisponible(){
    return typeof firebase !== 'undefined' && !!firebase.apps;
  }
  function cargarConfigSync(){
    if(!hasStorage) return null;
    try{
      var raw = localStorage.getItem(SYNC_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function guardarConfigSync(cfg){
    if(!hasStorage) return;
    try{ localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); }catch(e){}
  }
  function borrarConfigSync(){
    if(!hasStorage) return;
    try{ localStorage.removeItem(SYNC_KEY); }catch(e){}
  }
  function parsearConfigFirebase(texto){
    try{ return JSON.parse(texto); }catch(e){}
    try{
      var obj = (new Function('return (' + texto + ');'))();
      if(obj && typeof obj === 'object') return obj;
    }catch(e){}
    return null;
  }
  function saveLocalOnly(){
    if(!hasStorage) return;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.chanchas)); }catch(e){}
  }

  function activarListenerSync(){
    if(syncState.unsubscribe){ syncState.unsubscribe(); }
    syncState.unsubscribe = syncState.docRef.onSnapshot(function(doc){
      if(!doc.exists) return;
      var data = doc.data();
      var json = JSON.stringify((data && data.chanchas) || []);
      if(json === syncState.lastJSON) return; // es el eco de nuestro propio guardado
      syncState.lastJSON = json;
      state.chanchas = (data && data.chanchas) || [];
      saveLocalOnly();
      checkRepeticiones();
      render();
    }, function(){ /* problema de conexión: seguimos con lo que hay en local */ });
  }

  function pushToSync(){
    if(!syncState.enabled || !syncState.docRef) return;
    var json = JSON.stringify(state.chanchas);
    if(json === syncState.lastJSON) return;
    syncState.lastJSON = json;
    clearTimeout(syncState.pushTimer);
    syncState.pushTimer = setTimeout(function(){
      syncState.docRef.set({ chanchas: state.chanchas, updatedAt: Date.now() }).catch(function(){});
    }, 700);
  }

  function conectarSyncManual(config, code){
    if(!firebaseDisponible()){
      alert('No se pudo cargar el servicio de sincronización. Revisá la conexión a internet e intentá de nuevo.');
      return;
    }
    try{
      if(!firebase.apps.length){ firebase.initializeApp(config); }
      var db = firebase.firestore();
      var ref = db.collection('paridera_sync').doc(code);
      ref.get().then(function(snap){
        var usarRemoto = false;
        if(snap.exists){
          usarRemoto = confirm('Ya hay datos guardados en la nube con este código.\n\nAceptar = traer esos datos y reemplazar lo que tenés en este dispositivo.\nCancelar = subir lo que tenés en este dispositivo y reemplazar lo de la nube.');
        }
        syncState.db = db;
        syncState.docRef = ref;
        syncState.config = config;
        syncState.code = code;
        syncState.enabled = true;

        if(usarRemoto){
          var data = snap.data();
          state.chanchas = (data && data.chanchas) || [];
          syncState.lastJSON = JSON.stringify(state.chanchas);
          saveLocalOnly();
        } else {
          syncState.lastJSON = JSON.stringify(state.chanchas);
          ref.set({ chanchas: state.chanchas, updatedAt: Date.now() });
        }
        activarListenerSync();
        guardarConfigSync({ config: config, code: code });
        checkRepeticiones();
        render();
        alert('Sincronización activada. Usá el mismo código y la misma configuración en los otros dispositivos.');
      }).catch(function(){
        alert('No se pudo conectar. Revisá el código, la configuración pegada y la conexión a internet.');
      });
    }catch(e){
      alert('La configuración pegada no es válida. Copiala tal cual la muestra la consola de Firebase.');
    }
  }

  function autoReconectarSync(){
    var saved = cargarConfigSync();
    if(!saved || !saved.config || !saved.code) return;
    if(!firebaseDisponible()) return;
    try{
      if(!firebase.apps.length){ firebase.initializeApp(saved.config); }
      syncState.db = firebase.firestore();
      syncState.docRef = syncState.db.collection('paridera_sync').doc(saved.code);
      syncState.config = saved.config;
      syncState.code = saved.code;
      syncState.enabled = true;
      syncState.lastJSON = JSON.stringify(state.chanchas);
      activarListenerSync();
    }catch(e){ /* tablet vieja o sin red: seguimos solo con datos locales */ }
  }

  function desconectarSync(){
    if(syncState.unsubscribe){ syncState.unsubscribe(); }
    syncState = { enabled:false, config:null, code:'', db:null, docRef:null, unsubscribe:null, lastJSON:null, pushTimer:null };
    borrarConfigSync();
  }

  function persist(){
    if(hasStorage){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.chanchas));
      }catch(e){
        alert('No se pudo guardar (memoria del navegador llena o bloqueada). Hacé una exportación de respaldo desde el ícono de ajustes.');
      }
    }
    pushToSync();
  }
  function load(){
    if(!hasStorage){
      document.getElementById('storageBanner').style.display = 'block';
      state.loaded = true;
      render();
      return;
    }
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ state.chanchas = JSON.parse(raw); }
    }catch(e){ state.chanchas = []; }
    state.loaded = true;
    checkRepeticiones();
    state.repeticionQueue.forEach(function(id){ state.notifiedIds[id] = true; });
    if(state.repeticionQueue.length) notifyRepeticion(state.repeticionQueue.length);
    render();
    autoReconectarSync();
    setInterval(periodicCheck, 15 * 60 * 1000);
    document.addEventListener('visibilitychange', function(){
      if(!document.hidden) periodicCheck();
    });
  }

  function findById(list, id){
    for(var i=0; i<list.length; i++){

    var n = (numero || '').trim().toLowerCase();

  function bindDetailEvents(c){
    var overlay = document.getElementById('overlayDetail');
    overlay.addEventListener('mousedown', function(ev){ if(ev.target === overlay) closeDetail(); });
    document.getElementById('btnClose').onclick = closeDetail;

    document.getElementById('btnDelete').onclick = function(){
      if(confirm('¿Eliminar la ficha de la chancha N.º ' + (c.numero || '?') + '? Esta acción no se puede deshacer.')){
        state.chanchas = state.chanchas.filter(function(x){ return x.id !== c.id; });
        state.activeId = null;
        persist();
        render();
      }
    };

    function bindField(id, prop, target, isNumeric){
      var el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('change', function(){
        if(id === 'f_numero'){
          var nuevoNumero = el.value.trim();
          if(nuevoNumero && numeroDuplicado(nuevoNumero, c.id)){
            alert('Ya existe otra chancha con el número "' + nuevoNumero + '". Borrá esa ficha primero, o poné un número distinto.');
            el.value = c.numero;
            return;
          }
        }
        target[prop] = el.value;
        if(id === 'f_fechaServicio'){
          if(el.value){
            ciclo0().fechaProbableParto = addDaysISO(el.value, GESTACION_DIAS);
            ciclo0().repeticionProximaFecha = addDaysISO(el.value, REPETICION_DIAS);
            ciclo0().repeticionConfirmada = false;
          } else {
            ciclo0().repeticionProximaFecha = '';
            ciclo0().repeticionConfirmada = false;
          }
        }
        if(id === 'f_fechaRealParto' && el.value){
          ciclo0().repeticionConfirmada = true;
        }
        persist();
        render();
      });
    }
    function ciclo0(){ return c.ciclo; }

    bindField('f_numero','numero', c);
    bindField('f_fechaServicio','fechaServicio', c.ciclo);
    bindField('f_fechaProbableParto','fechaProbableParto', c.ciclo);
    bindField('f_fechaRealParto','fechaRealParto', c.ciclo);
    bindField('f_nacidosVivos','nacidosVivos', c.ciclo);
    bindField('f_nacidosMuertos','nacidosMuertos', c.ciclo);
    bindField('f_nacidosMomificados','nacidosMomificados', c.ciclo);
    bindField('f_pesoNacimiento','pesoNacimiento', c.ciclo);
    bindField('f_fechaDestete','fechaDestete', c.ciclo);
    bindField('f_lechonesDestetados','lechonesDestetados', c.ciclo);
    bindField('f_pesoDestete','pesoDestete', c.ciclo);
    bindField('f_observaciones','observaciones', c.ciclo);

    document.getElementById('btnAddSanidad').onclick = function(){
      var fecha = document.getElementById('f_sanFecha').value || todayISO();
      var desc = document.getElementById('f_sanDesc').value.trim();
      if(!desc) return;
      c.ciclo.sanidad.push({fecha: fecha, descripcion: desc});
      persist();
      renderModal();
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-del-san]'), function(btn){
      btn.onclick = function(){
        var i = parseInt(btn.getAttribute('data-del-san'), 10);
        c.ciclo.sanidad.splice(i,1);
        persist();
        renderModal();
      };
    });

    document.getElementById('btnNuevoCiclo').onclick = function(){
      if(!c.ciclo.fechaServicio){ alert('Todavía no hay datos cargados en el ciclo actual.'); return; }
      if(confirm('Esto archiva el ciclo actual en el historial y deja la ficha lista para un nuevo servicio. ¿Continuar?')){
        c.historial.push(c.ciclo);
        c.ciclo = nuevoCiclo();
        persist();
        renderModal();
        renderGrid();
      }
    };
  }

          '<div class="hint" style="margin:18px 0 14px;">Además, los datos quedan guardados en este mismo navegador/tablet. Si limpiás el historial o los datos del navegador, se pierden — por eso conviene exportar de vez en cuando como respaldo.</div>' +
          '<div class="field"><label>Exportar (copiar y guardar en otro lugar)</label>' +
          '<textarea id="exportBox" readonly>' + escapeHtml(JSON.stringify(state.chanchas)) + '</textarea>' +
          '<button class="btn secondary" id="btnCopy" style="margin-top:8px;">Seleccionar todo para copiar</button></div>' +
          '<div class="field"><label>Importar (pegar copia y reemplazar datos actuales)</label>' +
          '<textarea id="importBox" placeholder="Pegá acá el texto exportado..."></textarea>' +
          '<button class="btn secondary" id="btnImport" style="margin-top:8px;">Importar y reemplazar</button></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  function bindSettingsEvents(){
    if(!state.settingsOpen) return;
    var overlay = document.getElementById('overlaySettings');
    overlay.addEventListener('mousedown', function(ev){ if(ev.target === overlay){ state.settingsOpen=false; modalRoot.innerHTML=''; } });
    document.getElementById('btnCloseSettings').onclick = function(){ state.settingsOpen=false; modalRoot.innerHTML=''; };
    if(syncState.enabled){
      document.getElementById('btnSyncOff').onclick = function(){
        if(confirm('¿Desvincular este dispositivo? Vas a dejar de recibir actualizaciones automáticas de los demás, pero los datos que ya tenés acá se mantienen.')){
          desconectarSync();
          renderModal();
        }
      };
    } else {
      document.getElementById('btnSyncOn').onclick = function(){
        var texto = document.getElementById('syncConfigBox').value.trim();
        var code = document.getElementById('syncCodeBox').value.trim();
        if(!texto || !code){ alert('Completá la configuración de Firebase y el código de sincronización.'); return; }
        var config = parsearConfigFirebase(texto);
        if(!config){ alert('No se pudo leer la configuración pegada. Copiala tal cual la muestra la consola de Firebase.'); return; }
        conectarSyncManual(config, code);
      };
    }
    document.getElementById('btnCopy').onclick = function(){
      var box = document.getElementById('exportBox');
      box.focus(); box.select();
      try{ document.execCommand('copy'); }catch(e){}
      try{ navigator.clipboard && navigator.clipboard.writeText(box.value); }catch(e){}
    };
    document.getElementById('btnImport').onclick = function(){
      var txt = document.getElementById('importBox').value.trim();
      if(!txt) return;
      try{
        var data = JSON.parse(txt);
        if(!Array.isArray(data)) throw new Error('formato inválido');
        if(confirm('Esto reemplaza todos los datos actuales por los importados. ¿Continuar?')){
          state.chanchas = data;
          persist();
          state.settingsOpen = false;
          modalRoot.innerHTML = '';
          renderGrid();
        }
      }catch(e){
        alert('No se pudo leer el texto pegado. Revisá que sea una copia exportada desde esta misma app.');
      }
    };
  }

  // ---------- global events ----------
  document.getElementById('btnNueva').onclick = function(){
    var numero = prompt('Número de la chancha:');
    if(numero === null) return;
    numero = numero.trim();
    while(numero && numeroDuplicado(numero, null)){
      numero = prompt('Ya existe una chancha con el número "' + numero + '". Si es la misma, borrá esa ficha primero; si no, poné un número distinto.\n\nNúmero de la chancha:');
      if(numero === null) return;
      numero = numero.trim();
    }
    var c = nuevaChancha(numero);
    state.chanchas.push(c);
    persist();
    state.activeId = c.id;
    renderGrid();
    renderModal();
  };
  document.getElementById('btnSettings').onclick = function(){
    state.settingsOpen = true;
    renderModal();
  };
  document.getElementById('btnNotif').onclick = pedirPermisoNotificaciones;
  setupNotifications();
  document.getElementById('searchInput').addEventListener('input', function(){
    state.search = this.value;
    renderGrid();
  });
  document.getElementById('filterSelect').addEventListener('change', function(){
    state.filter = this.value;
    renderGrid();
  });
  function findAncestorWithAttr(el, attr){
    while(el && el !== document){
      if(el.getAttribute && el.getAttribute(attr)) return el;
      el = el.parentNode;
    }
    return null;
  }

  grid.addEventListener('click', function(ev){
    var btn = findAncestorWithAttr(ev.target, 'data-open');
    if(!btn) return;
    state.activeId = btn.getAttribute('data-open');
    renderModal();
  });

  function render(){
    renderGrid();
    renderModal();
  }

  load();
})();
</script>
</body>
</html>
